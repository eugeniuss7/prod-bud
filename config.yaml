# ProdBud configuration.
# To keep personal settings out of git, copy this file to %APPDATA%\ProdBud\config.yaml;
# that copy takes precedence. Tray menu → "Reload config" applies changes without restarting.

# Absolute path to your Obsidian vault (the folder that contains .obsidian).
# Use single quotes on Windows, e.g. 'C:\Users\you\Documents\MyVault'
# Leave empty to disable logging.
vaultPath: ''

# Folder inside the vault for per-entry notes.
logFolder: ProdBud

# Append a one-line summary to each day's daily note (<folder>/YYYY-MM-DD.md).
dailyNotes:
  enabled: true
  folder: ''             # e.g. 'Daily' if your daily notes live in a subfolder
  heading: '## ProdBud Log'

# Paused tasks become "unfinished" after this many minutes (0 = never).
autoUnfinishMin: 30

# The motivator nudges you after a task has been paused this long.
nudgeAfterMin: 10

# Global hotkey that opens the widget and focuses the task name field.
hotkey: 'Control+Alt+P'

# One-click preset tasks. kind: work (counts toward Tasks done/Duration)
# or break (counts toward Break time and interrupts running work).
# icons: dish, shirt, book, broom, code, coffee, dumbbell, controller, tv, music
presets:
  - { id: dishes,  name: Wash dishes, icon: dish,       kind: work,  category: chores }
  - { id: laundry, name: Laundry,     icon: shirt,      kind: work,  category: chores }
  - { id: study,   name: Study,       icon: book,       kind: work,  category: study }
  - { id: game,    name: Gaming,      icon: controller, kind: break, category: game }
